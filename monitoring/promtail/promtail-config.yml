server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: recruitment-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      # Include only the named application and monitoring containers; avoid
      # collecting Promtail's own logs and generating a feedback loop.
      - source_labels: [__meta_docker_container_name]
        regex: /recruitment-(backend|frontend|prometheus|grafana|node-exporter|cadvisor|loki)
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
