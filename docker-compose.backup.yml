version: "3.8"

services:
  backend:
    image: recruitment-backend:latest
    container_name: recruitment-backend-backup
    restart: unless-stopped
    env_file:
      - ./backend.env
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          require('http').get('http://localhost:5000/health', r => {
            process.exit(r.statusCode === 200 ? 0 : 1)
          }).on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: recruitment-frontend:latest
    container_name: recruitment-frontend-backup
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
