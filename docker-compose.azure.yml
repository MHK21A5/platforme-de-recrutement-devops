version: "3.8"

services:
  backend:
    image: recruitment-backend:latest
    container_name: recruitment-backend-azure
    restart: unless-stopped
    env_file:
      - ./backend.env
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          require('http').get('http://localhost:5000/health', r => {
            process.exit(r.statusCode === 200 ? 0 : 1)
          }).on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: recruitment-frontend:latest
    container_name: recruitment-frontend-azure
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    container_name: recruitment-caddy-azure
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.azure:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
