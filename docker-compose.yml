version: "3.8"

services:
  backend:
    image: recruitment-backend:latest
    container_name: recruitment-backend
    restart: unless-stopped
    env_file:
      - ./backend.env
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >
          require('http').get('http://localhost:5000/health', r => {
            process.exit(r.statusCode === 200 ? 0 : 1)
          }).on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: recruitment-frontend:latest
    container_name: recruitment-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: recruitment-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      - node-exporter
      - cadvisor
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://127.0.0.1:9090/-/healthy
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: recruitment-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    environment:
      # Local lab credentials only - replace for production use
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Email stays disabled until Jenkins supplies credentials and SMTP settings.
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME:-Recruitment Platform Alerts}
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_ALERT_EMAIL: ${GF_ALERT_EMAIL:-alerts@example.invalid}
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: recruitment-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: recruitment-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  loki:
    image: grafana/loki:3.6.8
    container_name: recruitment-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.6.8
    container_name: recruitment-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # Lab-only Docker socket access; production needs restricted daemon access.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_data:/var/lib/promtail
    depends_on:
      - loki

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:
